on:
  push:
    branches:
      - master
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Calcit 0.29.0-alpha.15 validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: 0.1.1

      - name: Validate Calcit snapshot and types
        run: |
          set -euo pipefail
          caps --strict --ci
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru --entry demo --check-only
          calcit calcit.cirru analyze check-public --ns 'wss.$meta' --ns wss.core --ns wss.test --ns wss.util --format json
          calcit calcit.cirru analyze quality --format json
          calcit calcit.cirru fix --rule concrete-return-proof-v1 --ns wss.core --def 'wss-each!' --format edn
          calcit calcit.cirru fix --rule callable-contract-proof-v1 --ns wss.core --def 'wss-each!' --format edn

      - name: Verify callback inventory stays explicitly unsupported
        run: |
          calcit calcit.cirru ffi export --json --ns wss.core > .calcit/wss-ffi.json
          python3 - <<'PY'
          import json
          with open('.calcit/wss-ffi.json') as source:
              interface = json.load(source)['data']['interface']
          entry = next(x for x in interface['definitions'] if x['id'] == 'wss.core/wss-each!')
          assert entry['lowering']['invoke'] == 'async'
          assert entry['lowering']['transport'] == 'async-task-v1'
          assert entry['status'] == 'unsupported'
          assert 'E_FFI_IR_CALLBACK_TYPE' in entry['diagnostic_codes']
          assert entry['signature'] is None
          PY

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.9.2

      - run: cargo fmt --check

      - run: cargo test --locked -- --test-threads=1

      - run: cargo clippy --locked --all-targets -- -D warnings

      - run: cargo build --locked --release

      - name: Verify C-safe exports only
        run: |
          exports="$(nm -D --defined-only target/release/libcalcit_wss.so)"
          grep -q ' calcit_ffi_async_version$' <<<"$exports"
          grep -q ' calcit_ffi_buffer_version$' <<<"$exports"
          grep -q ' wss_serve_calcit_ffi_async_v1$' <<<"$exports"
          grep -q ' wss_each_calcit_ffi_async_v1$' <<<"$exports"
          grep -q ' wss_send_calcit_ffi_v1$' <<<"$exports"
          grep -q ' wss_metrics_calcit_ffi_v1$' <<<"$exports"
          ! grep -Eq ' (abi_version|edn_version|wss_serve|wss_each|wss_send|wss_metrics)$' <<<"$exports"

      - run: mkdir -p dylibs/ && cp -v target/release/libcalcit_wss.so dylibs/

      - run: calcit calcit.cirru

      - name: Verify checked iteration boundary
        run: calcit calcit.cirru test 'wss.core/wss-each!' --require-match

      - name: Verify WebSocket connect, send, and cancellation
        run: bash scripts/check-wss-ffi.sh
